[project]
name = "stemsplitter"
version = "0.1.0"
description = "Prosty lokalny separator stemow z MP3/MP4"
requires-python = ">=3.11"
dependencies = [
    "audio-separator",
    "gradio>=4.0",
    "pyyaml>=6.0",
    "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemsplitter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
